      <text x="10" y="32" font-family="monospace" font-size="8" fill="#94a3b8">Three.js · R3F · Drei</text>

      <!-- Item 2 -->
      <rect y="48" width="182" height="42" rx="6" fill="#091428" stroke="#1e3a5f" stroke-width="0.8"/>
