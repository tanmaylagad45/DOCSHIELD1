<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="50%" stop-color="#08142b"/>
      <stop offset="100%" stop-color="#050b18"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1d38"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="180" rx="16" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Subtle connecting laser track across all nodes -->
  <line x1="90" y1="90" x2="910" y2="90" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="90" y1="90" x2="910" y2="90" stroke="url(#connGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ==================== STAGE 1: INGESTION ==================== -->
  <g transform="translate(40, 35)">
    <rect width="130" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="65" cy="30" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Upload Icon -->
    <path d="M 60 30 L 65 24 L 70 30 M 65 25 L 65 37 M 57 37 L 73 37" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1. Document Intake</text>
    <text x="65" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">SHA-256 Hashing</text>
    <text x="65" y="93" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">PDF · PNG · JPG</text>
  </g>

  <!-- Chevron 1 -->
  <path d="M 185 85 L 195 90 L 185 95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==================== STAGE 2: OCR EXTRACTION ==================== -->
  <g transform="translate(205, 35)">
    <rect width="130" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="65" cy="30" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- OCR Scan Icon -->
    <rect x="58" y="23" width="14" height="14" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="60" y1="30" x2="70" y2="30" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2. OCR Extraction</text>
    <text x="65" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Layout &amp; MRZ Zones</text>
    <text x="65" y="93" font-family="monospace" font-size="7.5" fill="#38bdf8" text-anchor="middle">Confidence Score</text>
  </g>

  <!-- Chevron 2 -->
  <path d="M 350 85 L 360 90 L 350 95" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==================== STAGE 3: FIELD VALIDATION ==================== -->
  <g transform="translate(370, 35)">
    <rect width="130" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="65" cy="30" r="14" fill="#4f46e5" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.2"/>
    <!-- Check Field Icon -->
    <path d="M 58 30 L 63 35 L 72 25" fill="none" stroke="#818cf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3. Field Validation</text>
    <text x="65" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Cross-Field Checks</text>
    <text x="65" y="93" font-family="monospace" font-size="7.5" fill="#818cf8" text-anchor="middle">Type &amp; Range Rules</text>
  </g>

  <!-- Chevron 3 -->
  <path d="M 515 85 L 525 90 L 515 95" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==================== STAGE 4: INTEGRITY SIGNALS ==================== -->
  <g transform="translate(535, 35)">
    <rect width="130" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="65" cy="30" r="14" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1.2"/>
    <!-- Shield Alert Icon -->
    <path d="M 65 21 L 73 25 L 73 33 Q 73 39 65 42 Q 57 39 57 33 L 57 25 Z" fill="none" stroke="#34d399" stroke-width="1.3"/>
    <line x1="65" y1="27" x2="65" y2="33" stroke="#34d399" stroke-width="1.3" stroke-linecap="round"/>
    <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4. Integrity Signals</text>
    <text x="65" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Forensic Heuristics</text>
    <text x="65" y="93" font-family="monospace" font-size="7.5" fill="#34d399" text-anchor="middle">Font &amp; Metadata</text>
  </g>

  <!-- Chevron 4 -->
  <path d="M 680 85 L 690 90 L 680 95" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==================== STAGE 5: COMPLIANCE ENGINE ==================== -->
  <g transform="translate(700, 35)">
    <rect width="130" height="110" rx="12" fill="url(#nodeGrad)" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="65" cy="30" r="14" fill="#9333ea" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.2"/>
    <!-- Scales of Justice Icon -->
    <path d="M 59 26 L 71 26 M 65 24 L 65 37 M 59 36 L 71 36" stroke="#c084fc" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 57 31 L 61 31 L 59 27 Z M 69 31 L 73 31 L 71 27 Z" fill="#c084fc" fill-opacity="0.4"/>
    <text x="65" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5. Policy Rules</text>
    <text x="65" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Declarative Criteria</text>
    <text x="65" y="93" font-family="monospace" font-size="7.5" fill="#c084fc" text-anchor="middle">Age · Expiry · KYC</text>
  </g>

  <!-- Chevron 5 -->
  <path d="M 845 85 L 855 90 L 845 95" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==================== STAGE 6: DECISION DOSSIER ==================== -->
  <g transform="translate(865, 35)">
    <rect width="95" height="110" rx="12" fill="url(#nodeGrad)" stroke="#059669" stroke-width="1.2" filter="url(#softGlow)"/>
    <circle cx="47.5" cy="30" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
    <!-- Check Circle Icon -->
    <circle cx="47.5" cy="30" r="8" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <path d="M 44 30 L 47 33 L 52 27" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="47.5" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">6. Result</text>
    <text x="47.5" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Explainable</text>
    <text x="47.5" y="93" font-family="monospace" font-size="7.5" fill="#10b981" text-anchor="middle">Pass / Review</text>
  </g>
</svg>
