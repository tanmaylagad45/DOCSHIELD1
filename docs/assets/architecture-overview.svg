<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="50%" stop-color="#081329"/>
      <stop offset="100%" stop-color="#040813"/>
    </linearGradient>

    <!-- Layer Gradient -->
