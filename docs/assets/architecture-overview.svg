      <text x="10" y="162" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Quality Evaluator</text>
      <text x="10" y="176" font-family="monospace" font-size="8" fill="#64748b">Blur, Glare &amp; Skew Check</text>
